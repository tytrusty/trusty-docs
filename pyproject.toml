# Lets `uv run examples/<file>.py` set up everything the examples need on first
# use.
[project]
name = "trusty-sim-examples"
version = "0.1.0a5"
description = "Examples for trusty-sim"
requires-python = ">=3.11"
dependencies = [
    "trusty-sim==0.1.0a5",
    "numpy>=1.26",
    "polyscope",
    "scipy",
    "trimesh",
    "matplotlib",
]

[tool.uv]
package = false
# trusty-sim wheels exist for Apple-silicon macOS and Linux x86_64.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
