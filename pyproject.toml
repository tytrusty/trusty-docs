# Lets `uv run examples/<file>.py` set up everything the examples need on first
# use: trusty-sim from TestPyPI, everything else from PyPI.
[project]
name = "trusty-sim-examples"
version = "0.1.0a4"
description = "Examples for trusty-sim"
requires-python = ">=3.11"
dependencies = [
    "trusty-sim==0.1.0a4",
    "numpy>=1.26",
    "polyscope",
    "scipy",
    "trimesh",
    "matplotlib",
]

[tool.uv]
package = false
# trusty-sim wheels exist for Apple-silicon macOS only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
trusty-sim = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true
